<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Products</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
    .container { max-width: 960px; margin: 0 auto; padding: 20px; }
    h1 { margin-bottom: 20px; font-size: 24px; }
    .filters { display: flex; gap: 12px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
    select, button { padding: 8px 16px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
    button { background: #0066ff; color: #fff; border: none; }
    button:disabled { opacity: 0.5; cursor: default; }
    .stats { font-size: 13px; color: #666; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; }
    th { background: #fafafa; font-weight: 600; white-space: nowrap; }
    tr:hover { background: #fafafa; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; background: #e8f0fe; color: #1a73e8; }
    .loading { text-align: center; padding: 40px; color: #999; }
    .error { color: #d32f2f; padding: 12px; background: #fbe9e7; border-radius: 6px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Products</h1>
    <div class="filters">
      <select id="category">
        <option value="">All Categories</option>
      </select>
      <button id="prevBtn" disabled>&larr; Prev</button>
      <button id="nextBtn" disabled>Next &rarr;</button>
      <span id="pageInfo" class="stats"></span>
    </div>
    <div id="error" class="error" style="display:none"></div>
    <div id="loading" class="loading">Loading...</div>
    <table id="table" style="display:none">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Category</th>
          <th>Price</th>
          <th>Created</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="pagination">
      <span id="pageStats"></span>
    </div>
  </div>
  <script>
    const API = '/api/products';
    let cursor = null;
    let prevCursors = [];
    let hasMore = false;
    let category = '';
    let loading = false;

    const categoryEl = document.getElementById('category');
    const tbody = document.getElementById('tbody');
    const table = document.getElementById('table');
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageInfo = document.getElementById('pageInfo');
    const pageStats = document.getElementById('pageStats');

    async function loadCategories() {
      try {
        const res = await fetch('/api/products/categories');
        const cats = await res.json();
        cats.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          categoryEl.appendChild(opt);
        });
      } catch {}
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    function hideError() {
      errorEl.style.display = 'none';
    }

    async function loadProducts(c) {
      if (loading) return;
      loading = true;
      hideError();
      loadingEl.style.display = 'block';
      table.style.display = 'none';
      try {
        const params = new URLSearchParams({ limit: '50' });
        if (c) params.set('cursor', c);
        if (category) params.set('category', category);
        const res = await fetch(API + '?' + params.toString());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        tbody.innerHTML = '';
        data.data.forEach(p => {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td>' + p.id + '</td><td>' + p.name + '</td><td><span class="badge">' + p.category + '</span></td><td>$' + Number(p.price).toFixed(2) + '</td><td>' + new Date(p.created_at).toLocaleDateString() + '</td>';
          tbody.appendChild(tr);
        });
        hasMore = data.hasMore;
        cursor = data.nextCursor;
        table.style.display = '';
        loadingEl.style.display = 'none';
        pageInfo.textContent = data.data.length > 0 ? 'Showing ' + data.data.length + ' products' : 'No products found';
        pageStats.textContent = prevCursors.length > 0 ? 'Page ' + (prevCursors.length + 1) : 'Page 1';
        prevBtn.disabled = prevCursors.length === 0;
        nextBtn.disabled = !hasMore;
      } catch (err) {
        loadingEl.style.display = 'none';
        showError('Failed to load products: ' + err.message);
      } finally {
        loading = false;
      }
    }

    categoryEl.addEventListener('change', () => {
      category = categoryEl.value;
      prevCursors = [];
      cursor = null;
      loadProducts(null);
    });

    prevBtn.addEventListener('click', () => {
      if (prevCursors.length === 0) return;
      cursor = prevCursors.pop();
      loadProducts(cursor);
    });

    nextBtn.addEventListener('click', () => {
      if (!hasMore || !cursor) return;
      prevCursors.push(cursor);
      loadProducts(cursor);
    });

    loadCategories();
    loadProducts(null);
  </script>
</body>
</html>
